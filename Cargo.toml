[workspace]
members = [".", "xtask"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "claude-vault"
version = "0.2.0"
edition = "2021"
description = "Claude Code conversation archive tool with SQLite + FTS5"
license = "MIT"
repository = "https://github.com/kuroko1t/claude-vault"
homepage = "https://github.com/kuroko1t/claude-vault"
keywords = ["claude-code", "sqlite", "fts5", "archive", "cli"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "claude-vault"
path = "src/main.rs"

[[bin]]
name = "claude-vault-mcp"
path = "src/mcp.rs"

[[bin]]
name = "claude-trainer"
path = "src/trainer.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tiktoken-rs = "0.5"
candle-core = { git = "https://github.com/huggingface/candle", branch = "main", version = "0.10.2" }
candle-transformers = { git = "https://github.com/huggingface/candle", branch = "main", version = "0.10.2" }
serde_yaml = "0.9.34"

[dev-dependencies]
tempfile = "3"
